[project]
name = "mediaferry-workspace"
version = "0.0.0"
description = "mediaferry workspace root"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["protocol", "mountd", "app"]

[tool.uv.sources]
mediaferry-protocol = { workspace = true }
mountd = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff は Markdown 内のコードブロックも整形する。docs/ は仕様書と実装計画の
# 正本で、そこに載るコードは説明のための引用なので、整形の対象にしない。
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "S"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# S105-S107 はリテラルの token / password を「ハードコードされた秘密」と見なす。
# テストのリース トークンや API キーは固定値でなければ検証できないので除く。
"**/tests/*" = ["S101", "S105", "S106", "S107", "ANN"]

# src レイアウトなので、明示しないと自前のパッケージがサードパーティ扱いになり
# import の並びが安定しない。
[tool.ruff.lint.isort]
known-first-party = ["mediaferry_protocol", "mountd", "mediaferry"]

[tool.pytest.ini_options]
testpaths = ["protocol/tests", "mountd/tests", "app/tests"]
addopts = "-m 'not needs_root and not needs_immich'"
markers = [
    "needs_root: マウントを伴うためコンテナか root でのみ実行できる",
    "needs_immich: 実 Immich サーバが必要",
]
