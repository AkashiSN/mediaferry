[project]
name = "mountd"
version = "0.0.0"
description = "Privileged mount broker for mediaferry"
requires-python = ">=3.12"
dependencies = ["mediaferry-protocol"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mountd"]
