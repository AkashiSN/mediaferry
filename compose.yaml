# TrueNAS の Apps → Custom App に貼り付けて使う。手順は docs/setup.md。
# <...> はデプロイ時に置き換える。環境固有の値はリポジトリに含めない。
#
# イメージは ghcr.io で公開している。`latest` は `main` の先頭を指すので、
# **版を固定したいときは `:sha-1234567` のようにコミットのタグを書く**。
#
# app は mountd のソケットに接続するため、両者の GID を揃える必要がある。
# MOUNTD_ALLOWED_UIDS に app の UID を指定すると、他プロセスからの接続を拒む。
name: mediaferry

services:
  mountd:
    image: ghcr.io/akashisn/mediaferry-mountd:latest
    restart: unless-stopped
    privileged: true
    volumes:
      - /dev:/dev                        # ホットプラグの伝播に必須
      - /lib/modules:/lib/modules:ro     # exfat モジュールの遅延ロード
      - <host-sock-path>:/run/mediaferry # ソケット専用。mountd のみ RW
    environment:
      MOUNTD_SOCKET: /run/mediaferry/broker.sock
      MOUNTD_MOUNT_ROOT: /run/mountd/mnt
      # app の UID のみ接続を許す (SO_PEERCRED)
      MOUNTD_ALLOWED_UIDS: "<app-uid>"
      # ソケットを app と共有するグループに付け替える。0660 にするだけでは
      # 所有者が root:root のままで、非 root の app は接続できない。
      MOUNTD_SOCKET_GID: "<app-gid>"

  app:
    image: ghcr.io/akashisn/mediaferry:latest
    restart: unless-stopped
    depends_on:
      - mountd
    user: "<app-uid>:<app-gid>"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    volumes:
      - <host-sock-path>:/run/mediaferry:ro   # 接続のみ。unlink・差し替えは不可
      # **先に library / derived / staging / work / var を作っておく。**
      # 起動時に「同じファイルシステム上にあること」を確かめるので、無いと落ちる
      # （staging は link(2) で公開するため library と同じ FS に要る）。
      - <host-dataset-path>:/data
      - app-tmp:/tmp
    environment:
      MEDIAFERRY_BROKER_SOCKET: /run/mediaferry/broker.sock
      MEDIAFERRY_DATA_ROOT: /data
      MEDIAFERRY_BIND_HOST: 127.0.0.1
      MEDIAFERRY_DEFAULT_TIMEZONE: <iana-tz>
      # 転送先の API キーを暗号化する鍵。**転送先を 1 つでも作るなら必須**。
      #   python3 -c "import base64,os; print(base64.b64encode(os.urandom(32)).decode())"
      MEDIAFERRY_SECRET_KEY: <base64-32bytes>
      # 転送先 (Immich の URL と API キー) は環境変数では設定しない。
      # Web 画面で「転送先プロファイル」として登録する。仕様書 §12.3。
    # **LAN から使うときは 3 つを同時に変える。**
    #
    # コンテナ内で 127.0.0.1 にだけ bind した状態で ports を書いても、Docker の
    # ポート転送はコンテナの eth0 宛に繋ぐため到達できない。0.0.0.0 で待ち受け、
    # かつ**パスワードを設定してから**出すこと（認証が無効なまま非ループバックに
    # bind していると、起動ログと画面に警告が出る）。
    #
    #   MEDIAFERRY_BIND_HOST: 0.0.0.0
    #   MEDIAFERRY_AUTH_PASSWORD: <password>
    #   ports: ["<host-ip>:<host-port>:8080"]

volumes:
  app-tmp:
