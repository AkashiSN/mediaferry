[project]
name = "mediaferry"
version = "0.0.0"
description = "mediaferry application"
requires-python = ">=3.12"
dependencies = [
    "mediaferry-protocol",
    "httpx>=0.28",
    "cryptography>=43",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

# テストは fake サーバではなく mountd の実物に対して行う。プロトコルの
# 取り違えを見逃さないため。マウント部分だけを fake に差し替える。
[dependency-groups]
dev = ["mountd"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediaferry"]

# .sql と .yaml はソースディストリビューションから漏れやすい。明示的に含める。
[tool.hatch.build.targets.wheel.force-include]
"src/mediaferry/db/migrations" = "mediaferry/db/migrations"
"src/mediaferry/core/profiles/builtin" = "mediaferry/core/profiles/builtin"
