[project]
name = "mediaferry"
version = "0.0.0"
description = "mediaferry application"
requires-python = ">=3.14"
dependencies = [
    "mediaferry-protocol",
    "httpx>=0.28",
    "cryptography>=43",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "argon2-cffi>=23",
    # EXIF は 1 タグしか読まない。画像をデコードしないものを選ぶ（§14）。
    "exifread>=3.0",
    # ユーザが書く正規表現を実行時の上限つきで当てる。標準の re に timeout は無い。
    "regex>=2024.0.0",
]

# テストは fake サーバではなく mountd の実物に対して行う。プロトコルの
# 取り違えを見逃さないため。マウント部分だけを fake に差し替える。
[dependency-groups]
dev = ["mountd"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediaferry"]

# `packages` が `src/mediaferry` 以下を丸ごと入れるので、`.sql` と `.yaml` も
# そのまま wheel に入る。**同じものを force-include で足さない** —— hatchling が
# 「同じパスに 2 つ目のファイルを足そうとした」で失敗する。
