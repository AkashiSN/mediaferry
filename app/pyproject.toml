[project]
name = "mediaferry"
version = "0.0.0"
description = "mediaferry application"
requires-python = ">=3.12"
dependencies = [
    "mediaferry-protocol",
    "httpx>=0.28",
]

# テストは fake サーバではなく mountd の実物に対して行う。プロトコルの
# 取り違えを見逃さないため。マウント部分だけを fake に差し替える。
[dependency-groups]
dev = ["mountd"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediaferry"]
