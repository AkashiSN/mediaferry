# Canon EOS（70D 等）。**カードリーダー経由の UMS のみ**（PTP はスコープ外、§2）。
slug: canon-eos
name: Canon EOS
hints:
  # **USB ID は入れない。** カードリーダー経由が前提なので、見える ID は
  # リーダーのものであって機種の手がかりにならない（足すと、そのリーダーに
  # 挿したどのカードにも当たる）。
  usb_ids: []
  # **exFAT で焼いた SDXC にはラベルが無い。** それでも残すのは、hint が
  # 順位付けにしか効かず（`hint_score`）一致の可否には関わらないため。
  # FAT32 のカードで当たれば得があり、当たらなくても損は無い。
  volume_labels: ["EOS_DIGITAL"]
require:
  roots: ["DCIM"]
  # 実体は DCIM/100CANON/ の下にある。iter_names はサブディレクトリを辿る。
  filename_pattern: '^(IMG_\d{4}\.(JPG|CR2)|MVI_\d{4}\.MOV)$'
  min_matching_files: 1
scan:
  roots: ["DCIM"]
  extensions: ["JPG", "CR2", "MOV"]
timestamp:
  # 写真は EXIF、動画は器（QuickTime の creation_time）、どちらも無ければ mtime。
  source: [exif, container, mtime]
  pattern: null
  format: null
  # **Canon は creation_time に現地の壁時計を書きながら Z を付ける。**
  # 真に受けると 9 時間ずれる（実測）。
  container_semantics: wall_clock
  # Immich は creation_time の Z を素直に UTC と読むので、撮影地の TZ を
  # 判定できない。壁時計にオフセットを付けて書き戻す。
  timezone_policy: force_offset
  # 地域固定の値は持たない。MEDIAFERRY_DEFAULT_TIMEZONE か画面で与える。
  timezone: null
merge:
  enabled: true
  tolerance_seconds: 5
  # **4GB 分割の実測は 3.9675 GiB。** 4 では弾かれる。別録画は 3 GiB にも
  # 届かないので、区別は保たれる。
  min_part_size_gib: 3
  sequence_pattern: '^MVI_(?P<seq>\d{4})$'
  # **器は QuickTime のまま。** 音声が PCM なので、MP4 は ffmpeg の版によって
  # 弾かれる（ipcm を持つのは新しい版だけ）。
  output_name: "MVI_{ts}_{first_seq}-{last_seq}_MERGED.MOV"
  keep_streams:
    video: primary
    audio: all
    timecode: false
    data: false
stack:
  # RAW+JPEG の同時記録。**先頭が primary**（Immich の一覧で代表になる方）。
  # **撮影時刻は見ない。** 組の身元はカード上の原名と同席の証拠で決まる。
  enabled: true
  extensions: ["JPG", "CR2"]
immich:
  tags: ["Canon EOS"]
  tag_pre_existing: true
  fix_datetime_after_upload: true
